<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Automio · Compras y recambios — Carbonell (demo)</title>
<link rel="icon" href="logo.png">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#111930;--ink2:#2c3a5a;--mute:#6b7690;--line:#e4e8f0;--line2:#eef1f6;--acc:#2f6db5;--acc2:#6f9bd0;--accbg:#e9f1fb;--navy:#111930;
--red:#c9382b;--redbg:#fdeceb;--amb:#a8600a;--ambbg:#fdf2dd;--grn:#0f7a4d;--grnbg:#e0f6ea;--vio:#5b4bb7;--viobg:#eceafb;--r:12px;--sh:0 1px 2px rgba(17,25,48,.04),0 4px 14px rgba(17,25,48,.05)}
*{box-sizing:border-box}html,body{margin:0}
body{font:13px/1.45 Inter,"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:18px 18px 14px}.brand img{height:30px;display:block}
.brand small{display:block;margin-top:7px;color:var(--mute);font-size:11px;letter-spacing:.02em}
nav{padding:6px 10px;flex:1;overflow:auto}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#9aa3b8;padding:14px 10px 6px;font-weight:600}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;color:var(--ink2);font-weight:500;text-align:left}
.nv svg{width:17px;height:17px;flex:none;stroke:#7c88a3}
.nv:hover{background:var(--line2)}
.nv.on{background:var(--navy);color:#fff}.nv.on svg{stroke:#fff}
.nv .bd{margin-left:auto;background:var(--redbg);color:var(--red);font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.nv.on .bd{background:rgba(255,255,255,.2);color:#fff}
.side-foot{padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mute);line-height:1.4}
main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 26px;background:rgba(243,245,249,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.srch{flex:1;max-width:480px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--mute);cursor:text}
.srch svg{width:16px;height:16px;stroke:var(--mute)}.srch kbd{margin-left:auto;font:11px monospace;background:var(--line2);border-radius:5px;padding:1px 6px}
.pill{background:var(--ambbg);color:var(--amb);font-weight:700;font-size:11px;padding:4px 10px;border-radius:20px;letter-spacing:.03em;white-space:nowrap}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.ib svg{width:17px;height:17px;stroke:var(--ink2)}.ib i{position:absolute;top:6px;right:7px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid #fff}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.sp{flex:1}
.page{padding:22px 26px 60px;max-width:1500px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}h2{font-size:14.5px;margin:0}h3{font-size:13px;margin:0}
.sub{color:var(--mute);margin-top:3px}
.hd{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.hd .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.cp{padding:16px 18px}.ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.ch .r{margin-left:auto;color:var(--mute);font-size:12px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.5fr 1fr}.g21{grid-template-columns:1fr 1fr}.g32{grid-template-columns:2fr 1fr}
.mb{margin-bottom:16px}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{color:var(--mute);font-size:12px;font-weight:500}.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
.kpi .d{font-size:12px;margin-top:3px;color:var(--mute)}.kpi .d b{font-weight:600}.up{color:var(--grn)}.dn{color:var(--red)}
.kpi svg.spk{position:absolute;right:12px;bottom:12px;opacity:.9}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-weight:600;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--line2)}.btn svg{width:15px;height:15px;stroke:currentColor}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.p:hover{background:#1d2a4d}
.btn.a{background:var(--acc);border-color:var(--acc);color:#fff}.btn.a:hover{background:#255c9c}
.btn.g{background:var(--grn);border-color:var(--grn);color:#fff}.btn.sm{padding:4px 10px;font-size:12px}.btn[disabled]{opacity:.45;cursor:default}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-gry{background:#eef0f4;color:#566079}.t-blu{background:var(--accbg);color:var(--acc)}.t-grn{background:var(--grnbg);color:var(--grn)}.t-amb{background:var(--ambbg);color:var(--amb)}.t-red{background:var(--redbg);color:var(--red)}.t-vio{background:var(--viobg);color:var(--vio)}
.tabs{display:flex;gap:4px;background:#e9edf4;padding:3px;border-radius:10px;overflow:auto}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--mute);white-space:nowrap}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(17,25,48,.12)}.tabs button span{color:#9aa3b8;margin-left:4px;font-weight:500}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.in{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 11px;min-width:0}
.in.s{width:260px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8a94ab;font-weight:600;text-align:left;padding:9px 14px;background:#fafbfd;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
th.sr{cursor:pointer}th.sr:hover{color:var(--ink)}
td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.rw{cursor:pointer}tr.rw:hover td{background:#f8fafd}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink2);font-weight:600}
.mu{color:var(--mute)}.sm{font-size:12px}.b{font-weight:600}
.prog{height:6px;border-radius:6px;background:#e9edf4;overflow:hidden;min-width:70px}.prog i{display:block;height:100%;background:var(--acc);border-radius:6px}
.prog.r i{background:var(--red)}.prog.a i{background:#e0a02b}.prog.g i{background:#26a56b}
.row{display:flex;align-items:center;gap:10px}
.li{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line2);align-items:flex-start;cursor:pointer}.li:hover{background:#f8fafd}.li:last-child{border:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.split>*,.grid>*{min-width:0}.split{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
.sel{background:var(--accbg)!important;box-shadow:inset 3px 0 0 var(--acc)}
.step{display:flex;gap:0;margin:4px 0}
.stp{flex:1;position:relative;padding-top:20px;text-align:center;font-size:11.5px;color:var(--mute)}
.stp:before{content:"";position:absolute;top:5px;left:0;right:0;height:3px;background:#e3e8f1}
.stp:after{content:"";position:absolute;top:0;left:50%;margin-left:-6px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid #cdd5e4}
.stp.d{color:var(--ink)}.stp.d:before{background:var(--acc)}.stp.d:after{background:var(--acc);border-color:var(--acc)}
.stp.c{color:var(--ink);font-weight:700}.stp.c:after{border-color:var(--acc)}
.stp:first-child:before{left:50%}.stp:last-child:before{right:50%}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px}.dl dt{color:var(--mute)}.dl dd{margin:0;font-weight:500}
.ov{position:fixed;inset:0;background:rgba(17,25,48,.38);z-index:60;display:none}
.ov.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:61;box-shadow:-10px 0 40px rgba(17,25,48,.18);display:none;flex-direction:column}
.dr.on{display:flex}.dr .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}.dr .db{padding:18px 20px;overflow:auto;flex:1}.dr .df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pal{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,94vw);background:#fff;border-radius:14px;z-index:71;box-shadow:0 24px 70px rgba(17,25,48,.3);display:none;overflow:hidden}
.pal.on{display:block}.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:15px;outline:0}
.pal .res{max-height:50vh;overflow:auto}.pal .it{display:flex;gap:10px;padding:10px 18px;cursor:pointer;align-items:center}.pal .it:hover,.pal .it.h{background:var(--accbg)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:11px;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw;display:none}
.toast.on{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
svg text{font-family:inherit}
.dwg{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:6px}
.hot{cursor:pointer}.hot circle{fill:#fff;stroke:var(--acc);stroke-width:1.6}.hot text{font-size:10.5px;font-weight:700;fill:var(--acc2);fill:var(--acc)}
.hot.on circle,.hot:hover circle{fill:var(--acc)}.hot.on text,.hot:hover text{fill:#fff}
.note{background:var(--accbg);color:var(--accink,#1d4f8c);border-radius:10px;padding:10px 13px;font-size:12.5px}
.warn{background:var(--ambbg);color:var(--amb);border-radius:10px;padding:10px 13px;font-size:12.5px}
.mn{display:none}
textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;min-height:120px;resize:vertical}
.kb{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kc{background:#e9edf4;border-radius:12px;padding:10px;min-height:200px}.kc h3{padding:4px 6px 10px;display:flex;gap:8px;align-items:center}.kc h3 span{color:var(--mute);font-weight:500}
.kcard{background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(17,25,48,.08);cursor:pointer}
.chk{width:16px;height:16px;accent-color:var(--navy)}
@media(max-width:980px){.g4{grid-template-columns:1fr 1fr}.g3,.g2,.g21,.g32{grid-template-columns:1fr}.split{grid-template-columns:1fr}}
@media(max-width:820px){
 .app{grid-template-columns:1fr}aside{display:none}.page{padding:16px 14px 100px}.top{padding:10px 14px}.srch kbd,.top .hide-m,.srch span{display:none}.srch{flex:none;width:40px;justify-content:center;padding:8px}
 .mn{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .mn button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);padding:4px 0;position:relative;font-weight:600}.mn button svg{width:21px;height:21px;stroke:currentColor}.mn button.on{color:var(--navy)}
 .mn button .bd{position:absolute;top:0;left:55%;background:var(--red);color:#fff;border-radius:10px;padding:0 5px;font-size:10px}
 h1{font-size:19px}.in.s{width:100%}.kb{grid-template-columns:repeat(4,80vw)}.dl{grid-template-columns:100px 1fr}.hd .r{margin-left:0;width:100%}
}
@media(max-width:980px){.pl>:first-child{order:2}}@media(max-width:480px){.g4{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px 13px}.kpi .v{font-size:21px}.kpi svg.spk{display:none}}
</style></head>
<body>
<div class="app"><aside id="side"></aside><main><div class="top" id="top"></div><div class="page" id="page"></div></main></div>
<div class="mn" id="mn"></div>
<div class="ov" id="ov"></div><div class="dr" id="dr"></div>
<div class="pal" id="pal"><input id="pin" placeholder="Buscar pieza, pedido, proveedor o plano…" autocomplete="off"><div class="res" id="pres"></div></div>
<div class="toast" id="toast"></div>
<script>
/* Demo Automio para Carbonell. Datos de operación ficticios (DATOS DE EJEMPLO). Gamas de máquina y logotipo: carbonellcia.com. Nada se envía ni se escribe en ningún sistema. */
const $=s=>document.querySelector(s);
const IC={panel:'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',inbox:'M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z',docs:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8M8 9h2',cart:'M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L21 8H6M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2z',box:'M21 8l-9-5-9 5v8l9 5 9-5zM3.3 7.5L12 12.5l8.7-5M12 22V12.5',truck:'M1 3h14v13H1zM15 8h4l3 3v5h-7M5.5 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18.5 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',users:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',chart:'M18 20V10M12 20V4M6 20v-6',act:'M22 12h-4l-3 9L9 3l-3 9H2',search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0',check:'M20 6L9 17l-5-5',x:'M18 6L6 18M6 6l12 12',plus:'M12 5v14M5 12h14',dl:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',more:'M5 12h.01M12 12h.01M19 12h.01',send:'M22 2L11 13M22 2l-7 20-4-9-9-4z',alert:'M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01'};
const ico=n=>`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n]||''}"/></svg>`;
/* ---------- util ---------- */
let seed=20261119;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
const ri=(a,b)=>Math.floor(a+rnd()*(b-a+1));
const eur=v=>(v||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const eur0=v=>Math.round(v||0).toLocaleString('es-ES')+' €';
const NOW=new Date();NOW.setHours(9,0,0,0);
const dayo=n=>{const d=new Date(NOW);d.setDate(d.getDate()+n);return d};
const fd=d=>d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'}).replace('.','');
const fdl=d=>d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const lastMonths=n=>{const r=[];for(let i=n-1;i>=0;i--){const d=new Date(NOW.getFullYear(),NOW.getMonth()-i,1);r.push(MES[d.getMonth()])}return r};
function chip(k,m){const e=m[k];return e?`<span class="tag ${e[0]}">${e[1]}</span>`:esc(k)}
/* ---------- charts ---------- */
function spark(a,col='#2f6db5',w=84,h=30){const mx=Math.max(...a),mn=Math.min(...a),r=mx-mn||1;const p=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-3-(v-mn)/r*(h-6)).toFixed(1)}`).join(' ');return `<svg class="spk" width="${w}" height="${h}"><polyline points="${p}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function bars(vals,labels,{h=190,col='#2f6db5',fmt=eur0,hi=-1}={}){const w=560,mx=Math.max(...vals)*1.12||1,bw=w/vals.length;let s=`<svg viewBox="0 0 ${w} ${h+26}" width="100%" style="display:block">`;for(let g=0;g<=3;g++){const y=h-g*h/3;s+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="#eef1f6"/>`+(g?`<text x="${w}" y="${y-4}" text-anchor="end" font-size="10" fill="#9aa3b8">${fmt(mx*g/3)}</text>`:"")}vals.forEach((v,i)=>{const bh=v/mx*h,x=i*bw+bw*.2;s+=`<rect x="${x}" y="${h-bh}" width="${bw*.6}" height="${bh}" rx="5" fill="${i===hi||i===vals.length-1?col:'#c9d9ee'}"><title>${labels[i]}: ${fmt(v)}</title></rect><text x="${x+bw*.3}" y="${h+16}" text-anchor="middle" font-size="10.5" fill="#6b7690">${labels[i]}</text>`});return s+'</svg>'}
function line(series,labels,{h=170,cols=['#2f6db5','#6f9bd0']}={}){const w=560,all=series.flat(),mx=Math.max(...all)*1.1||1,n=labels.length;let s=`<svg viewBox="0 0 ${w} ${h+24}" width="100%" style="display:block">`;for(let g=0;g<=3;g++){const y=h-g*h/3;s+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="#eef1f6"/>`}
series.forEach((a,k)=>{const pts=a.map((v,i)=>[i/(n-1)*(w-12)+6,h-v/mx*h]);s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${cols[k]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;if(k===0)s+=`<polygon points="6,${h} ${pts.map(p=>p.join(',')).join(' ')} ${w-6},${h}" fill="${cols[0]}" opacity=".08"/>`});

function route(){const h=location.hash.replace(/^#\/?/,'').split('/');return{m:h[0]||'panel',id:h[1]||''}}
function go(m,id){location.hash='#/'+m+(id?'/'+id:'')}
function render(){const r=route();shell();const v=V[r.m]||V.panel;$('#page').innerHTML=v(r.id);window.scrollTo(0,0)}
function rerender(){const y=window.scrollY;shell();const r=route();$('#page').innerHTML=(V[r.m]||V.panel)(r.id);window.scrollTo(0,y)}
window.addEventListener('hashchange',render);
function drawer(title,body,foot=''){$('#dr').innerHTML=`<div class="dh"><div style="flex:1">${title}</div><button class="ib" onclick="closeD()">${ico('x')}</button></div><div class="db">${body}</div>${foot?`<div class="df">${foot}</div>`:''}`;$('#dr').classList.add('on');$('#ov').classList.add('on');$('#ov').onclick=closeD}
function closeD(){$('#dr').classList.remove('on');$('#ov').classList.remove('on');$('#pal').classList.remove('on')}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}

function palRes(q){q=q.toLowerCase().trim();const out=[];
 PARTS.forEach(p=>{if(!q||(p.id+p.d).toLowerCase().includes(q))out.push(['box',p.id+' · '+p.d,'Recambio · stock '+p.stock,()=>{go('recambios');setTimeout(()=>partD(p.id),30)}])});
 ORD.forEach(o=>{if(!q||(o.id+SM[o.sup].n+o.ref).toLowerCase().includes(q))out.push(['cart',o.id+' · '+SM[o.sup].n,'Pedido · '+eur(o.tot),()=>go('pedidos',o.id)])});
 SUP.forEach(s=>{if(!q||s.n.toLowerCase().includes(q))out.push(['users',s.n,'Proveedor · '+s.city,()=>go('proveedores',s.id)])});
 DOCS.forEach(d=>{if(!q||d.t.toLowerCase().includes(q))out.push(['docs',d.t,d.tipo+' · '+d.rev,()=>{S.sel.doc=d.id;go('planos')}])});
 window._pr=out.slice(0,9);$('#pres').innerHTML=window._pr.map((r,i)=>`<div class="it" onclick="palGo(${i})">${ico(r[0]).replace('<svg','<svg width="17" height="17" stroke="#6b7690"')}<div><div class="b">${esc(r[1])}</div><div class="mu sm">${r[2]}</div></div></div>`).join('')||'<div class="it mu">Sin resultados</div>'}

document.addEventListener('input',e=>{if(e.target.id==='pin')palRes(e.target.value)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();pal()}if(e.key==='Escape')closeD();if(e.key==='Enter'&&$('#pal').classList.contains('on')&&window._pr&&window._pr[0])palGo(0)});

 <div class="grid g32 mb"><div class="card"><div class="ch"><h2>Requiere tu decisión</h2><span class="r"><a href="#/bandeja" style="color:var(--acc);font-weight:600;text-decoration:none">Ver todo (${ap.length})</a></span></div>${ap.slice(0,4).map(a=>`<div class="li" onclick="S.sel.ap='${a.id}';go('bandeja')"><i class="dot" style="background:${PRI[a.pri]}"></i><div style="flex:1;min-width:0"><div class="b">${esc(a.t)}</div><div class="mu sm">${a.tipo} · ${a.ref}${a.imp?' · '+eur(a.imp):''}</div></div><span class="mu sm">${a.pri}</span></div>`).join('')||'<div class="cp mu">Nada pendiente.</div>'}</div>

 <div class="grid g2 mb"><div class="card"><div class="ch"><h2>Gasto en compras por mes</h2><span class="r">Últimos 12 meses</span></div><div class="cp">${bars(spendM,lastMonths(12))}</div></div>

 <div class="grid g4 mb"><div class="card kpi"><div class="l">Cumplimiento (OTIF)</div><div class="v ${s.otif<80?'dn':''}">${s.otif} %</div></div><div class="card kpi"><div class="l">Calidad</div><div class="v">${s.cal} %</div></div><div class="card kpi"><div class="l">Plazo medio</div><div class="v">${s.lead} d</div></div><div class="card kpi"><div class="l">Condiciones de pago</div><div class="v" style="font-size:20px;margin-top:11px">${s.pay}</div></div></div>
 <div class="grid g32 mb"><div class="card"><div class="ch"><h2>Cumplimiento mensual</h2></div><div class="cp">${line([hist],lastMonths(12))}</div></div><div class="card"><div class="ch"><h2>Contacto</h2></div><div class="cp"><dl class="dl"><dt>Persona</dt><dd>${s.ct}</dd><dt>Teléfono</dt><dd>${s.tel}</dd><dt>Email</dt><dd>${s.em}</dd></dl></div></div></div>
 <div class="grid g21"><div class="card"><div class="ch"><h2>Pedidos recientes</h2></div>${os.map(o=>`<div class="li" onclick="go('pedidos','${o.id}')"><div style="flex:1"><div class="b">${o.id}</div><div class="mu sm">${fd(o.dOrd)} · ${eur(o.tot)}</div></div>${chip(o.st,ST_O)}</div>`).join('')||'<div class="cp mu">Sin pedidos recientes.</div>'}</div>
 <div class="card"><div class="ch"><h2>Referencias que suministra</h2></div>${ps.map(p=>`<div class="li" onclick="go('recambios');setTimeout(()=>partD('${p.id}'),30)"><div style="flex:1"><div class="b">${esc(p.d)}</div><div class="id">${p.id}</div></div><b>${eur(p.price)}</b></div>`).join('')||'<div class="cp mu">Sin referencias.</div>'}</div></div>`}
/* envíos */
const ST_E={prep:['t-amb','En preparación'],listo:['t-blu','Listo para salir'],tr:['t-vio','En tránsito'],ent:['t-grn','Entregado']};
V.envios=()=>{const cols=[['prep','En preparación'],['listo','Listo para salir'],['tr','En tránsito'],['ent','Entregado']];
 return `<div class="hd"><div><h1>Envíos a cliente</h1><div class="sub">Recambios que salen de Rubí. Cada envío enlaza con su pedido o servicio.</div></div></div><div class="kb">${cols.map(c=>`<div class="kc"><h3>${c[1]}<span>${S.ship.filter(s=>s.st===c[0]).length}</span></h3>${S.ship.filter(s=>s.st===c[0]).map(s=>`<div class="kcard" onclick="shipD('${s.id}')"><div class="row"><span class="id">${s.id}</span><span class="mu sm" style="margin-left:auto">${s.f===0?'hoy':fd(dayo(s.f))}</span></div><div class="b" style="margin:5px 0 2px">${esc(s.c)}</div><div class="mu sm">${esc(s.cont)}</div><div class="mu sm" style="margin-top:6px">${s.z} · ${s.peso}</div></div>`).join('')}</div>`).join('')}</div>`};
function shipD(id){const s=S.ship.find(x=>x.id===id);const nx={prep:'listo',listo:'tr',tr:'ent'}[s.st];drawer(`<div class="id">${s.id}</div><h2 style="font-size:18px;margin-top:4px">${esc(s.c)}</h2><div class="mu sm">${s.z}</div>`,`<div class="mb">${chip(s.st,ST_E)}</div><dl class="dl"><dt>Contenido</dt><dd>${esc(s.cont)}</dd><dt>Peso</dt><dd>${s.peso}</dd><dt>Origen</dt><dd>${s.ref}</dd><dt>Seguimiento</dt><dd>${s.tr}</dd></dl>`,nx?`<button class="btn p" onclick="advShip('${s.id}')">Pasar a «${ST_E[nx][1]}»</button>`:'')}
function advShip(id){const s=S.ship.find(x=>x.id===id);s.st={prep:'listo',listo:'tr',tr:'ent'}[s.st];if(s.st==='tr'&&s.tr==='—')s.tr='MRW 0082'+ri(100,999);log('Javier A.',`movió el envío ${id} a «${ST_E[s.st][1]}» (simulado)`);closeD();toast('Estado actualizado en la demo.');rerender()}
/* informes */
V.informes=()=>{const n=S.ui.rng||12;const m=lastMonths(12).slice(-n),sp=spendM.slice(-n);const tot=sp.reduce((a,b)=>a+b,0);const bysup=SUP.map(s=>({n:s.n,v:ORD.filter(o=>o.sup===s.id).reduce((a,o)=>a+o.tot,0)*2+ri(1500,6000)})).sort((a,b)=>b.v-a.v);const mx=bysup[0].v;
 return `<div class="hd"><div><h1>Informes</h1><div class="sub">Compras, plazos y servicio. Se calculan sobre los datos de ejemplo.</div></div><div class="r"><div class="tabs">${[3,6,12].map(x=>`<button class="${n===x?'on':''}" onclick="S.ui.rng=${x};rerender()">${x} meses</button>`).join('')}</div><button class="btn" onclick="toast('Informe exportado (simulado, no se genera ningún archivo).')">${ico('dl')}Exportar</button></div></div>
 <div class="grid g4 mb"><div class="card kpi"><div class="l">Gasto en el periodo</div><div class="v">${eur0(tot)}</div><div class="d"><b class="up">−4,2 %</b> vs. periodo anterior</div></div><div class="card kpi"><div class="l">Plazo medio de entrega</div><div class="v">4,6 d</div><div class="d"><b class="up">−0,5 d</b></div></div><div class="card kpi"><div class="l">Compras urgentes</div><div class="v">9 %</div><div class="d">de las líneas pedidas</div></div><div class="card kpi"><div class="l">Horas de gestión ahorradas</div><div class="v">38 h</div><div class="d">estimación del periodo</div></div></div>
 <div class="grid g21 mb"><div class="card"><div class="ch"><h2>Gasto mensual</h2></div><div class="cp">${bars(sp,m)}</div></div><div class="card"><div class="ch"><h2>Gasto por proveedor</h2></div><div class="cp">${bysup.slice(0,7).map(s=>`<div style="display:grid;grid-template-columns:170px 1fr 78px;gap:10px;align-items:center;margin:9px 0"><span class="sm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.n}</span><div class="prog"><i style="width:${s.v/mx*100}%"></i></div><b class="sm n">${eur0(s.v)}</b></div>`).join('')}</div></div></div>
 <div class="grid g21"><div class="card"><div class="ch"><h2>Cumplimiento por proveedor (OTIF)</h2></div><div class="cp">${hbar(SUP.slice().sort((a,b)=>a.otif-b.otif).map(s=>[s.n,s.otif,s.otif]))}</div></div><div class="card"><div class="ch"><h2>Plazo prometido y real (días)</h2></div><div class="cp">${line([SUP.map(s=>s.lead+ri(0,3)),SUP.map(s=>s.lead)],SUP.map(s=>s.id.slice(3)))}<div class="legend" style="margin-top:8px"><span><i style="background:#2f6db5"></i>Real</span><span><i style="background:#6f9bd0"></i>Prometido</span></div></div></div></div>`};
V.actividad=()=>`<div class="hd"><div><h1>Actividad</h1><div class="sub">Todo lo que hace Automio queda registrado. Cada acción sobre un tercero espera tu aprobación.</div></div></div><div class="card">${S.act.map(a=>`<div class="li" style="cursor:default"><div class="av" style="width:30px;height:30px;font-size:11px;${a.w==='Automio'?'background:var(--navy)':''}">${a.w==='Automio'?'AU':'JA'}</div><div style="flex:1"><div><b>${a.w}</b> ${esc(a.x)}</div></div><span class="mu sm">${a.t}</span></div>`).join('')}</div>`;
render();
</script></body></html>
