<link rel="stylesheet" href="app.css">
<style>
/* Carbonell-specific bits */
.doc{position:relative;min-height:340px}
.doc .pg{color:var(--mute);font-size:11px;margin-bottom:10px;letter-spacing:.06em;font-weight:650}
.doc table{width:100%;border-collapse:collapse;margin-top:8px}
.doc td,.doc th{border:1px solid var(--line);padding:6px 9px;text-align:left;font-size:12px}
.doc th{background:#fafbfc}
.doc td.miss{color:var(--red,#b42318);font-weight:650}
mark{background:#fdf0c4;padding:0 3px;border-radius:3px}
mark.sel{outline:2px solid var(--blu)}
.f{padding:13px 16px;border-top:1px solid var(--line2)}
.f:first-of-type{border-top:0}
.f label{display:block;font-size:11.5px;color:var(--mute);margin-bottom:3px}
.f .v{display:flex;gap:10px;align-items:center;justify-content:space-between}
.f input{font:inherit;font-size:13px;border:1px solid transparent;border-radius:7px;padding:4px 8px;margin-left:-8px;width:62%}
.f input:focus{border-color:var(--navy);outline:2px solid #b2c3e4}
.ref{font-size:11.5px;color:var(--blu);cursor:pointer;text-decoration:underline;white-space:nowrap}
.split{display:grid;grid-template-columns:1.05fr 1fr;gap:16px}
.back{color:var(--blu);cursor:pointer;margin-bottom:12px;display:inline-block;font-size:13px;font-weight:600}
.draft{padding:16px;white-space:pre-wrap;font-size:13px;line-height:1.7;background:#fff}
.sumcard{cursor:pointer;transition:box-shadow .12s}
.sumcard:hover{box-shadow:var(--sh2)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 2px;border-top:1px solid var(--line2);font-size:13px}
.chk:first-of-type{border-top:0}
.chk .ic{flex:none;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:1px}
.chk.ok .ic{background:#e4f4ea;color:#067647}
.chk.ko .ic{background:#fde8e6;color:#b42318}
.chk.ko{color:#101828}
.chk.ko .why{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.qa{border-top:1px solid var(--line2);margin-top:6px;padding-top:12px}
.qa .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.qa .chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;background:#fff;color:var(--navy)}
.qa .chip:hover{border-color:var(--navy)}
.qa .q{font-size:12.5px;font-weight:700;color:var(--navy);margin:10px 0 3px}
.qa .a{font-size:13px;line-height:1.55;color:#344054}
.qa .a .refp{display:block;font-size:11.5px;color:var(--mute);margin-top:3px}
.qa form{display:flex;gap:8px;margin-top:10px}
.qa input{flex:1;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.qa input:focus{border-color:var(--navy);outline:2px solid #b2c3e4}
@media(max-width:900px){.split{grid-template-columns:1fr}.doc{min-height:0}#tlm{display:block!important}}
</style></head><body>

{id:'i1',what:"Plano de conjunto de la prensa P-12 (revisión vigente)",to:"Oficina técnica (interno)",asked:"hace 9 días",hist:[["hace 9 días","Pedido por correo."],["hace 6 días","Recordatorio sin respuesta."]]},
{id:'i2',what:"Manual de la talladora T-3 con la revisión vigente",to:"Proveedor de la talladora",asked:"hace 5 días",hist:[["hace 5 días","Petición enviada al comercial."]]},
{id:'i3',what:"Certificado de material del eje de la R-240",to:"Proveedor A",asked:"hace 2 días",hist:[["hace 2 días","Petición enviada."],["ayer","Responden que lo adjuntan esta semana."]]}]};
const $=s=>document.querySelector(s);const LS=C.key+'-v4';
let D={};try{D=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
let state={route:'hoy',tab:'sup',open:null};
let drafts=[];try{drafts=JSON.parse(localStorage.getItem(LS+'-drafts')||'[]')}catch(e){}
function saveAll(){try{localStorage.setItem(LS,JSON.stringify(D));localStorage.setItem(LS+'-drafts',JSON.stringify(drafts))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function go(r,x){state.route=r;if(x&&x.tab)state.tab=x.tab;closeDr();render();window.scrollTo(0,0)}
function icon(k){const paths={inbox:'M3 4h18v15H3z M3 12h5l2 3h4l2-3h5',doc:'M6 2h9l5 5v15H6z M14 2v6h6',gear:'M12 8a4 4 0 100 8 4 4 0 000-8z M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m9.9 9.9l2.1 2.1m0-14.1l-2.1 2.1M7 17l-2.1 2.1',send:'M22 2L11 13M22 2l-7 20-4-9-9-4z',more:'M4 6h16M4 12h16M4 18h16',cart:'M3 3h2l2.6 12.4A2 2 0 009.6 17h8.8a2 2 0 001.95-1.55L22 7H6M9 21a1 1 0 100-2 1 1 0 000 2zM18 21a1 1 0 100-2 1 1 0 000 2z'};return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[k]||paths.more}"/></svg>`}
const ICONS={hoy:'inbox',planos:'doc',compra:'cart',recambios:'gear',peticiones:'send',mas:'more'};
function planosPend(){return C.planos.filter(d=>(d.st==='Por revisar'||d.st==='Con problemas')&&!D['doc'+d.id])}
function validated(d){return !!(D['doc'+d.id]||d.st==='Validado')}
function listasPend(){return C.planos.filter(d=>d.bom&&validated(d)&&!D['lc'+d.id])}
function pendingCount(){return planosPend().length+listasPend().length+C.parts.filter(p=>p.stock<p.min).length+C.info.filter(i=>!D[i.id]).length}
function navHTML(){return C.nav.map(([k,t])=>`<a role="button" tabindex="0" class="${state.route===k?'on':''}" onclick="go('${k}')" onkeydown="if(event.key==='Enter')go('${k}')"><span class="navicon">${icon(ICONS[k])}</span>${t}${k==='hoy'?`<span class="n">${pendingCount()}</span>`:''}</a>`).join('')}
function nav(){$('#side').innerHTML=`<div class="brand"><div style="font-weight:800;font-size:19px;letter-spacing:.04em;color:var(--navy)">CARBONELL</div><small>ASISTENTE DE COMPRAS Y RECAMBIOS</small></div><div class="nav-section">OPERACIONES</div>${navHTML()}<div class="side-foot"><div class="identity"><span class="avatar">J</span><div>Javier<br><span class="mut">Entorno de demostración</span></div></div><div class="independent">Demo independiente · Datos ficticios<br>No conectada al correo ni al ERP</div></div>`;$('#mob').innerHTML=navHTML()}
function closeDr(){$('#dr').classList.remove('on')}
$('#dr').addEventListener('click',e=>{if(e.target.id==='dr')closeDr()});
function openDr(h){$('#pn').innerHTML=h;$('#dr').classList.add('on')}
function tagOf(d,done){if(done||d.st==='Validado')return `<span class="tag t-grn">Validado</span>`;if(d.st==='Con problemas')return `<span class="tag t-red">Con problemas</span>`;if(d.st.indexOf('Pedido')===0)return `<span class="tag t-amb">${esc(d.st)}</span>`;return `<span class="tag t-amb">${esc(d.st)}</span>`}
/* ------- Hoy ------- */
function vHoy(){const docsP=planosPend();const partsP=C.parts.filter(p=>p.stock<p.min);const infoP=C.info.filter(i=>!D[i.id]);const lcP=listasPend();
 let h=`<div class="heading"><div class="eyebrow">COMPRAS / RECAMBIOS / PLANOS</div><h1>Por revisar</h1><div class="sub">Lo que necesita tu decisión hoy. Nada se envía ni se valida sin ti.</div></div>`;
 h+=`<div class="grid k3" style="margin-bottom:16px">
 <div class="card kpi ${docsP.some(d=>d.st==='Con problemas')?'bad':''} sumcard" onclick="go('planos')"><b>${docsP.length}</b><span>Planos y documentos por validar${docsP.some(d=>d.st==='Con problemas')?' · 1 con problemas':''}</span></div>
 <div class="card kpi ${partsP.length?'warn':''} sumcard" onclick="go('recambios')"><b>${partsP.length}</b><span>Recambios bajo mínimo</span></div>
 <div class="card kpi ${infoP.length?'bad':''} sumcard" onclick="go('peticiones',{tab:'info'})"><b>${infoP.length}</b><span>Peticiones de información abiertas</span></div></div>`;
 h+=`<div class="card"><h2>Cola del día</h2>`;
 if(docsP.length)h+=docsP.map(d=>`<div class="item"><span class="dot ${d.st==='Con problemas'?'d-red':'d-blu'}"></span><div class="b"><b>${esc(d.n)}</b><div class="small mut">${d.t} · ${esc(d.src)} · ${d.st==='Con problemas'?'se han detectado problemas en la revisión automática':'espera tu validación'}</div></div><button class="btn ghost" onclick="openPlano(${d.id})">Revisar</button></div>`).join('');
 if(lcP.length)h+=lcP.map(d=>`<div class="item"><span class="dot d-blu"></span><div class="b"><b>Lista de compra · ${esc(d.n)}</b><div class="small mut">Generada del plano validado · ${d.bom.filter(l=>!l.blocked).length} línea${d.bom.filter(l=>!l.blocked).length>1?'s':''} · pendiente de tu revisión</div></div><button class="btn ghost" onclick="go('compra')">Revisar</button></div>`).join('');
 if(partsP.length)h+=partsP.map((p)=>`<div class="item"><span class="dot d-amb"></span><div class="b"><b>${esc(p.r)}</b> · ${esc(p.d)}<div class="small mut">Stock ${p.stock}/${p.min} · ${esc(p.sup)} · ${esc(p.lead)}</div></div><button class="btn ghost" onclick="ask('${esc(p.r)}')">Preparar petición</button></div>`).join('');
 if(infoP.length)h+=infoP.map(i=>`<div class="item"><span class="dot d-red"></span><div class="b"><b>${esc(i.what)}</b><div class="small mut">${esc(i.to)} · pedido ${esc(i.asked)}</div></div><button class="btn ghost" onclick="remindInfo('${i.id}')">Preparar recordatorio</button></div>`).join('');
 if(!docsP.length&&!lcP.length&&!partsP.length&&!infoP.length)h+=`<div class="empty">Todo revisado. No queda nada pendiente.</div>`;
 h+=`</div><p class="small mut" style="margin-top:14px">Aprobar registra la decisión en local. En esta demo no se envía ningún correo ni se escribe en ningún sistema.</p>`;
 $('#view').innerHTML=h}
/* ------- Planos ------- */
function vPlanos(){$('#view').innerHTML=`<div class="heading"><div class="eyebrow">DOCUMENTACIÓN TÉCNICA</div><h1>Planos</h1><div class="sub">Planos, esquemas y manuales en un solo sitio. Cada dato extraído lleva su página de origen, la revisión automática marca lo que llega con problemas y nada se da por bueno sin ti.</div></div><div class="card">${C.planos.map(d=>{const done=D['doc'+d.id];return `<div class="item" style="cursor:pointer" onclick="openPlano(${d.id})"><span class="dot ${d.st==='Con problemas'?'d-red':(d.st==='Validat'||done||d.st==='Validado')?'d-grn':'d-amb'}"></span><div class="b"><b>${esc(d.n)}</b><div class="small mut">${d.t} · ${esc(d.src)}</div></div>${tagOf(d,done)}</div>`}).join('')}</div><p class="small mut" style="margin-top:14px">El plano de la prensa P-12 sigue pedido a oficina técnica sin respuesta: está en Peticiones, con su historial y el recordatorio preparado.</p>`}
function openPlano(id){const d=C.planos.find(x=>x.id===id);if(!d)return;const done=D['doc'+id];const dev=D['dev'+id];
 if(!d.f.length){openDr(`<button class="x" onclick="closeDr()" aria-label="Cierra">×</button><span class="tag t-amb">${esc(d.st)}</span><h2 style="margin:10px 0 4px">${esc(d.n)}</h2><div class="mut small">${d.t} · ${esc(d.src)}</div><p class="small" style="margin:12px 0">Este plano aún no ha llegado. Se pidió a oficina técnica hace 9 días y el recordatorio no tuvo respuesta.</p><div class="act"><button class="btn" onclick="closeDr();remindInfo('${d.req||'i1'}')">Preparar recordatorio</button></div>`);return}
 const ko=d.checks.filter(c=>!c[1]);
 const prev=d.pv?`<div class="pg">PREVISUALIZACIÓN SIMULADA · ${esc(d.pv.cap)}</div><b>LISTA DE PIEZAS / DATOS</b><table><tr><th>Pos.</th><th>Descripción</th><th>Ref.</th></tr>${d.pv.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="${r[3]===3?'miss':''}">${r[3]===3?esc(r[2]):`<mark id="h${r[3]}">${esc(r[2])}</mark>`}</td></tr>`).join('')}</table><p class="mut small" style="margin-top:14px">Documento simulado para la demo. En producción verías el PDF real con los campos resaltados encima.</p>`:'';
 const checks=d.checks.length?`<h3 style="margin:0 0 4px">Revisión automática</h3>${ko.length?`<p class="small mut" style="margin:0 0 8px">${ko.length} problema${ko.length>1?'s':''} detectado${ko.length>1?'s':''} en lo recibido de oficina técnica.</p>`:`<p class="small mut" style="margin:0 0 8px">Sin problemas detectados.</p>`}${d.checks.map(c=>`<div class="chk ${c[1]?'ok':'ko'}"><span class="ic">${c[1]?'✓':'!'}</span><span>${esc(c[0])}${c[1]?'':`<span class="why">${esc(c[2])}</span>`}</span></div>`).join('')}`:'';
 const fields=d.f.map((f,i)=>`<div class="f"><label>${esc(f[0])}</label><div class="v">${f[1].startsWith('No consta')?`<span class="tag t-amb">No consta en el documento</span>`:`<input value="${esc(f[1])}" ${done?'disabled':''}>`}<span class="ref" onclick="hl(${i})">${esc(f[2])}</span></div></div>`).join('');
 const qa=d.qa.length?`<div class="qa"><h3 style="margin:0 0 8px">Preguntar sobre el plano</h3><div class="chips">${d.qa.map((q,qi)=>`<span class="chip" onclick="askQ(${id},${qi})">${esc(q.q)}</span>`).join('')}</div><div id="qa-log"></div><form onsubmit="return askFree(${id},this)"><input name="q" placeholder="Escribe una pregunta sobre el documento…" autocomplete="off"><button class="btn ghost" type="submit">Preguntar</button></form><p class="small mut" style="margin-top:8px">Respuestas simuladas con los datos de ejemplo de este documento. En producción respondería sobre el documento real indicando la página.</p></div>`:'';
 const acts=(done?`<span class="dec">Validado · ${done.ts}</span> <button class="btn ghost" onclick="undoDoc(${id})">Deshacer</button>`
  :`${ko.length?`<button class="btn ghost" onclick="prepDev(${id})">${dev?'Ver devolución preparada':'Preparar devolución con lo que falta'}</button>`:''}<button class="btn ghost" onclick="closeDr()">Dejar para después</button><button class="btn" onclick="okDoc(${id})">Validar datos</button>`)+((d.bom&&validated(d))?`<button class="btn ghost" onclick="closeDr();go('compra')">Preparar lista de compra</button>`:'');
 openDr(`<button class="x" onclick="closeDr()" aria-label="Cierra">×</button>${tagOf(d,done)}<h2 style="margin:10px 0 4px">${esc(d.n)}</h2><div class="mut small">${d.t} · ${esc(d.src)}</div><p class="small mut" style="margin:10px 0 16px">Revisa cada dato con su origen. Nada se da por bueno sin tu confirmación.</p>${checks?`<div class="card" style="padding:12px 16px;margin-bottom:14px">${checks}</div>`:''}<div class="split"><div class="card doc">${prev}</div><div class="card" style="padding:4px 0">${fields}<div class="act" style="padding:12px 16px">${acts}</div></div></div>${qa?`<div class="card" style="margin-top:14px;padding:14px 16px">${qa}</div>`:''}`)}
function hl(i){document.querySelectorAll('mark').forEach(x=>x.classList.remove('sel'));const e=document.getElementById('h'+i);if(e){e.classList.add('sel');e.scrollIntoView({block:'center'})}}
function okDoc(id){D['doc'+id]={ts:new Date().toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};saveAll();closeDr();toast('Documento validado. Registrado en local.');render()}
function undoDoc(id){delete D['doc'+id];saveAll();closeDr();toast('Validación deshecha');render()}
function askQ(id,qi){const d=C.planos.find(x=>x.id===id);if(!d)return;const q=d.qa[qi];if(!q)return;appendQA(q.q,`${esc(q.a)}<span class="refp">Origen: ${esc(q.p)}</span>`)}
function askFree(id,form){const txt=(form.q.value||'').trim();if(!txt)return false;const d=C.planos.find(x=>x.id===id);form.q.value='';
 if(d){const low=txt.toLowerCase();const hit=d.qa.find(q=>q.kws.some(k=>low.includes(k)));
  if(hit){appendQA(txt,`${esc(hit.a)}<span class="refp">Origen: ${esc(hit.p)}</span>`);return false}}
 appendQA(txt,`En esta demo solo puedo responder con los datos de ejemplo de este documento. En producción respondería sobre el plano real indicando la página y el cajetín de donde sale cada dato.`);return false}
function appendQA(q,a){const log=document.getElementById('qa-log');if(!log)return;log.insertAdjacentHTML('beforeend',`<div class="q">${esc(q)}</div><div class="a">${a}</div>`);log.lastElementChild.scrollIntoView({block:'nearest'})}
function prepDev(id){const d=C.planos.find(x=>x.id===id);if(!d)return;const dev=D['dev'+id];const ko=d.checks.filter(c=>!c[1]);
 openDr(`<button class="x" onclick="closeDr()" aria-label="Cierra">×</button><span class="tag t-amb">Devolución a oficina técnica</span><h2 style="margin:10px 0 4px">${esc(d.n)}</h2><div class="mut small">${esc(d.src)}</div><p class="small" style="margin:12px 0 6px">El plano llega con ${ko.length} problema${ko.length>1?'s':''}. Este borrador devuelve el documento pidiendo justo lo que falta:</p><ul class="tl" style="margin:0 0 12px">${ko.map(c=>`<li>${esc(c[3]||c[0])}</li>`).join('')}</ul><h3 style="margin:16px 0 6px">Borrador preparado (editable)</h3><textarea id="dev-body">Para: Oficina técnica\nAsunto: Plano R-240 · faltan datos para validarlo\n\nHola,\n\nHe revisado el plano de conjunto de la reductora R-240 y no puedo darlo por bueno:\n${ko.map(c=>'- '+(c[3]||c[0])).join('\n')}\n\n¿Me pasáis la versión corregida? Lo necesito para cerrar el pedido de recambios de esta semana.\n\nGracias,\nJavier\nCarbonell (demo)</textarea><div class="act"><button class="btn ghost" onclick="closeDr()">Dejar para después</button><button class="btn" onclick="approveDev(${id})">Aprobar (simulación)</button></div>${dev?`<p class="small dec">Ya aprobada ${dev.ts} · no se ha enviado nada</p>`:`<p class="small mut">Aprobar registra la decisión en local. No se envía ningún correo.</p>`}`)}
function approveDev(id){D['dev'+id]={action:'aprobada',ts:new Date().toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};saveAll();closeDr();toast('Devolución aprobada. En producción quedaría lista para enviar; aquí no se envía nada.');render()}
/* ------- Lista de compra ------- */
function vCompra(){const docs=C.planos.filter(d=>d.bom);
 let h=`<div class="heading"><div class="eyebrow">DEL PLANO A LA COMPRA</div><h1>Lista de compra</h1><div class="sub">Con el plano validado, su lista de piezas pasa a ser una lista de compra revisable: cada línea lleva su posición en el plano, proveedor, plazo y precio orientativo. Ajustas cantidades, quitas líneas y nada se pide sin tu aprobación.</div></div>`;
 const ready=docs.filter(d=>validated(d));
 if(!ready.length){h+=`<div class="card empty">Todavía no hay ningún plano validado con lista de piezas. Valida uno en Planos y aquí aparecerá su lista de compra.<div class="act" style="justify-content:center;margin-top:12px"><button class="btn ghost" onclick="go('planos')">Ir a Planos</button></div></div>`;$('#view').innerHTML=h;return}
 h+=ready.map(d=>{
  const dec=D['lc'+d.id];const sel=d.bom.filter(l=>!l.blocked);
  const total=sel.reduce((s2,l)=>s2+l.p*l.qty,0);
  const fmt=n=>n.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
  const rows=d.bom.map((l,i)=>{
   if(l.blocked)return `<tr><td></td><td><b>${esc(l.desc)}</b><div class="small mut">${esc(l.src)}</div></td><td colspan="3"><span class="tag t-amb">Bloqueada</span> <span class="small mut">${esc(l.blocked)}</span>${d.id===1?` <button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="prepDev(1)">Ver devolución preparada</button>`:''}</td><td></td></tr>`;
   return `<tr><td><input type="checkbox" id="lc-c${d.id}-${i}" checked${dec?' disabled':''}></td><td><b>${esc(l.ref)}</b><div class="small mut">${esc(l.desc)} · pos. ${esc(l.pos)}</div></td><td class="small mut">${esc(l.src)}</td><td><input type="number" min="1" value="${l.qty}" id="lc-q${d.id}-${i}" style="width:64px"${dec?' disabled':''}></td><td class="small">${esc(l.sup)} · ${esc(l.lead)}</td><td class="small">${fmt(l.p)} /ud</td></tr>`;
  }).join('');
  if(dec)return `<div class="card" style="margin-bottom:14px"><div class="headrow"><div><h3>${esc(d.n)}</h3><div class="small mut">${d.bom.length} línea${d.bom.length>1?'s':''} · ${sel.length} a proveedor</div></div><span class="tag ${dec.action==='aprobada'?'t-grn':'t-gry'}">${dec.action==='aprobada'?'Aprobada':'Descartada'} · ${dec.ts}</span></div>${dec.action==='aprobada'?`<p class="small" style="margin:10px 0 0">Borradores por proveedor preparados en Peticiones. No se ha enviado nada.</p><div class="act"><button class="btn ghost" onclick="go('peticiones',{tab:'sup'})">Ver borradores</button> <button class="btn ghost" onclick="undoLista(${d.id})">Deshacer</button></div>`:`<div class="act"><button class="btn ghost" onclick="undoLista(${d.id})">Recuperar lista</button></div>`}</div>`;
  return `<div class="card" style="margin-bottom:14px;padding:0"><div class="headrow" style="padding:16px 18px 0"><div><h3>${esc(d.n)}</h3><div class="small mut">Generada del plano validado · ${sel.length} línea${sel.length>1?'s':''} a proveedor · total orientativo ${fmt(total)} (precios de ejemplo)</div></div><span class="tag t-blu">Pendiente de revisión</span></div><div class="tw"><table style="min-width:640px;margin-top:10px"><thead><tr><th></th><th>Pieza</th><th>Origen</th><th>Cant.</th><th>Proveedor</th><th>Precio</th></tr></thead><tbody>${rows}</tbody></table></div><div class="act" style="padding:0 18px 16px"><button class="btn ghost" onclick="decLista(${d.id})">Descartar</button><button class="btn" onclick="genLista(${d.id})">Aprobar y preparar borradores</button></div></div>`;
 }).join('');
 h+=`<p class="small mut" style="margin-top:14px">Proveedores, plazos y precios son de ejemplo. Aprobar crea borradores en Peticiones; no se envía ningún pedido.</p>`;
 $('#view').innerHTML=h}
function genLista(id){const d=C.planos.find(x=>x.id===id);if(!d)return;
 const lines=d.bom.map((l,i)=>({...l,i})).filter(l=>!l.blocked).map(l=>{const c=document.getElementById(`lc-c${id}-${l.i}`);const q=document.getElementById(`lc-q${id}-${l.i}`);return {...l,on:!c||c.checked,qty:q?(Math.max(1,parseInt(q.value)||l.qty)):l.qty}}).filter(l=>l.on);
 if(!lines.length){toast('Selecciona al menos una línea');return}
 const bySup={};lines.forEach(l=>{(bySup[l.sup]=bySup[l.sup]||[]).push(l)});
 let short=d.n.replace(/^Plano de conjunto |^Ficha técnica |^Esquema eléctrico |^Manual de mantenimiento /,'');short=short.charAt(0).toUpperCase()+short.slice(1);
 Object.keys(bySup).forEach((sup,k)=>{const ref=`LC${id}-${k}`;if(drafts.some(x=>x.ref===ref))return;
  drafts.push({kind:'sup',ref,title:`Pedido ${short} → ${sup}`,body:`Para: ${sup}\nAsunto: Pedido de piezas · ${d.n}\n\nBuenos días,\n\nCon el plano ya validado, necesitaríamos:\n${bySup[sup].map(l=>`- ${l.qty} × ${l.ref} (${l.desc}) · ${l.src}`).join('\n')}\n\nPlazo habitual: ${bySup[sup][0].lead}.\nPrecios orientativos según última compra.\n\nGracias,\nJavier\nCarbonell (demo)`})});
 D['lc'+id]={action:'aprobada',ts:new Date().toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};saveAll();go('peticiones',{tab:'sup'});toast('Lista aprobada. Borradores preparados en Peticiones; no se ha enviado nada.')}
function decLista(id){D['lc'+id]={action:'descartada',ts:new Date().toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};saveAll();toast('Lista descartada');render()}
function undoLista(id){delete D['lc'+id];saveAll();toast('Lista recuperada');render()}
/* ------- Recambios ------- */
function vRecambios(){$('#view').innerHTML=`<div class="heading"><div class="eyebrow">ALMACÉN</div><h1>Recambios</h1><div class="sub">Piezas encontradas en los documentos validados, con stock y proveedor habitual. Preparar una petición no la envía: pasa por tu aprobación.</div></div><div class="card tw"><table><thead><tr><th>Referencia</th><th>Origen</th><th>Proveedor</th><th>Stock</th><th>Estado</th><th></th></tr></thead><tbody>${C.parts.map(p=>{const low=p.stock<p.min;return `<tr><td><b>${esc(p.r)}</b><div class="small mut">${esc(p.d)}</div></td><td class="small mut">${esc(p.from)}</td><td class="small">${esc(p.sup)} · ${esc(p.lead)}</td><td>${p.stock} / ${p.min}</td><td><span class="tag ${low?'t-red':'t-grn'}">${low?'Bajo mínimo':'Correcto'}</span></td><td>${low?`<button class="btn ghost" onclick="ask('${esc(p.r)}')">Preparar petición</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`}
function ask(ref){const p=C.parts.find(x=>x.r===ref);if(!p)return;const q=p.min*2-p.stock;
 if(!drafts.some(d=>d.ref===ref&&!D['draft-'+ref])){drafts.push({kind:'sup',ref,body:`Para: ${p.sup}\nAsunto: Petición de recambios ${p.r}\n\nBuenos días,\n\nNecesitaríamos ${q} unidades de ${p.r} (${p.d}).\nOrigen de la referencia: ${p.from}.\nPlazo habitual: ${p.lead}.\n\nGracias.`});saveAll()}
 go('peticiones',{tab:'sup'});toast('Borrador preparado en Peticiones')}
/* ------- Peticiones ------- */
function vPeticiones(){const t=state.tab;let h=`<div class="heading"><div class="eyebrow">SALIENTES</div><h1>Peticiones</h1><div class="sub">Borradores preparados para revisar. Aprobar registra la decisión; en esta demo no se envía nada.</div></div><div class="tabs">${[['sup','A proveedor'],['info','De información y planos']].map(([k,tt])=>`<button class="${t===k?'on':''}" onclick="state.tab='${k}';render()">${tt}</button>`).join('')}</div><div id="mb"></div>`;
 $('#view').innerHTML=h;const mb=$('#mb');
 if(t==='sup'){const open=drafts.filter(d=>!D['draft-'+d.ref]);const done=drafts.filter(d=>D['draft-'+d.ref]);
  let x=open.length?open.map(d=>`<div class="card" style="margin-bottom:12px"><div class="headrow"><h3>${esc(d.title||('Petición de recambios '+d.ref))}</h3><span class="tag t-amb">Borrador</span></div><div class="mailprev"><div class="draft" id="db-${esc(d.ref)}" contenteditable="true">${esc(d.body)}</div></div><div class="act"><button class="btn ghost" onclick="discardDraft('${esc(d.ref)}')">Descartar</button><button class="btn" onclick="approveDraft('${esc(d.ref)}')">Aprobar (simulación)</button></div></div>`).join(''):`<div class="card empty">Ninguna petición pendiente. Elige una pieza bajo mínimo en Recambios.</div>`;
  if(done.length)x+=`<div class="card"><h2>Registro</h2>${done.map(d=>{const dd=D['draft-'+d.ref];return `<div class="item"><span class="dot ${dd.action==='aprobada'?'d-grn':'d-red'}"></span><div class="b"><b>Petición ${esc(d.ref)}</b><div class="small"><span class="dec ${dd.action==='aprobada'?'':'rej'}">${dd.action==='aprobada'?'Aprobada (no enviada)':'Descartada'}</span> · ${dd.ts}</div></div></div>`}).join('')}</div>`;
  mb.innerHTML=x;return}
 let x=C.info.map(i=>{const dd=D[i.id];return `<div class="card" style="margin-bottom:12px"><div class="headrow"><div><h3>${esc(i.what)}</h3><div class="small mut">${esc(i.to)} · pedido ${esc(i.asked)}</div></div>${dd?`<span class="tag t-grn">Recordatorio aprobado</span>`:`<button class="btn ghost" onclick="remindInfo('${i.id}')">Preparar recordatorio</button>`}</div><ul class="tl" style="margin-top:12px">${i.hist.map(h=>`<li><b>${esc(h[0])}</b> · ${esc(h[1])}</li>`).join('')}</ul>${dd?`<div class="small dec" style="margin-top:8px">Aprobado ${dd.ts} · no se ha enviado nada</div>`:''}</div>`}).join('');
 mb.innerHTML=x||`<div class="card empty">Ninguna petición de información abierta.</div>`}
function discardDraft(ref){const el=document.getElementById('db-'+CSS.escape(ref));if(el){const d=drafts.find(x=>x.ref===ref);if(d)d.body=el.innerText}
 D['draft-'+ref]={action:'descartada',ts:new Date().toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};saveAll();toast('Borrador descartado');render()}
function approveDraft(ref){const el=document.getElementById('db-'+CSS.escape(ref));if(el){const d=drafts.find(x=>x.ref===ref);if(d)d.body=el.innerText}
 D['draft-'+ref]={action:'aprobada',ts:new Date().toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};saveAll();toast("Aprobada. En producción quedaría lista para enviar; aquí no se envía nada.");render()}
function remindInfo(id){const i=C.info.find(x=>x.id===id);if(!i)return;
 openDr(`<button class="x" onclick="closeDr()" aria-label="Cierra">×</button><span class="tag t-amb">Recordatorio</span><h2 style="margin:10px 0 4px">${esc(i.what)}</h2><div class="mut small">${esc(i.to)} · pedido ${esc(i.asked)}</div><ul class="tl" style="margin-top:14px">${i.hist.map(h=>`<li><b>${esc(h[0])}</b> · ${esc(h[1])}</li>`).join('')}</ul><h3 style="margin:16px 0 6px">Borrador preparado (editable)</h3><textarea id="rem-body">Buenos días,\n\nOs vuelvo a escribir sobre: ${i.what}. Lo pedimos ${i.asked} y aún no lo hemos recibido.\n\nNos hace falta para cerrar el mantenimiento de esta semana. ¿Podéis confirmarnos cuándo lo tendremos?\n\nGracias,\nJavier\nCarbonell (demo)</textarea><div class="act"><button class="btn ghost" onclick="closeDr()">Dejar para después</button><button class="btn" onclick="approveRem('${id}')">Aprobar (simulación)</button></div><p class="small mut">Aprobar registra la decisión en local. No se envía ningún correo.</p>`)}
function approveRem(id){D[id]={action:'aprobada',ts:new Date().toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};saveAll();closeDr();toast("Recordatorio aprobado. No se ha enviado nada.");render()}
/* ------- Más ------- */
function vMas(){$('#view').innerHTML=`<div class="heading"><h1>Más</h1></div><div class="card"><h2>Qué es real y qué es simulado</h2><p class="small">Maqueta independiente para la reunión del 19/11 con Javier. Todos los datos son ficticios: planos, problemas detectados, stocks, proveedores y peticiones. No está conectada al correo, al ERP ni a ninguna carpeta; aprobar solo registra la decisión dentro de este navegador. Las respuestas del asistente sobre los planos son de ejemplo, calculadas sobre los datos ficticios del documento.</p><p class="small">Lo que sí es real es el flujo: cada plano recibido pasa una revisión automática que marca lo que falta (revisión vigente, lista de piezas, firma), cada dato extraído lleva la página de origen, se puede preguntar sobre el documento con referencias, del plano validado se genera una lista de compra revisable (cantidades, proveedores y precios orientativos), y cada borrador (devolución, recordatorio o pedido) se aprueba antes de enviarse.</p></div><div class="card" style="margin-top:14px"><h2>Por qué esta demo</h2><p class="small">En la primera conversación Javier trasladó que lleva compras, recambios y logística, y que muchas veces pide planos, información y manuales y no recibe nada, o los recibe con problemas, y lo acaba haciendo todo a mano. Por eso la demo pone el plano en el centro: pedirlo, recibirlo, detectar lo que le falta, devolverlo pidiendo la corrección, consultarlo con preguntas, sacar de él los recambios y, con el plano ya validado, pasar las piezas a comprar sin hacerlo a mano, todo con aprobación humana.</p></div><div class="act"><button class="btn ghost" onclick="resetAll()">Reiniciar la demo</button></div>`}
function resetAll(){if(!confirm('¿Borra las decisiones locales y reinicia la demo?'))return;D={};drafts=[];saveAll();toast('Demo reiniciada');go('hoy')}
function render(){nav();({hoy:vHoy,planos:vPlanos,compra:vCompra,recambios:vRecambios,peticiones:vPeticiones,mas:vMas}[state.route]||vHoy)()}
const _pv=new URLSearchParams(location.search);
if(_pv.get('v'))state.route=_pv.get('v');
if(_pv.get('t'))state.tab=_pv.get('t');
render();
if(_pv.get('doc'))openPlano(Number(_pv.get('doc')));
</script></body></html>
