<style>:root{--bg:#eef0f4;--card:#fff;--ink:#1c2b43;--mute:#667085;--line:#e3e7ee;--side:#fff;--red:#d92d20;--redbg:#fee4e2;--amb:#b54708;--ambbg:#fff3df;--grn:#067647;--grnbg:#dcfae6;--acc:#0b5fa5;--accbg:#e8f1fa;--accink:#0a4c83;--navy:#16324f}

nav a{display:flex;align-items:center;gap:9px;color:#34405a;text-decoration:none;padding:7px 10px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13px;margin-bottom:1px}
nav a svg{width:16px;height:16px;stroke:#667085;flex:none}
nav a:hover{background:#f2f4f8}
nav a.on{background:var(--accbg);color:var(--accink);font-weight:600}
nav a.on svg{stroke:var(--acc)}
nav a .n{margin-left:auto;background:var(--acc);color:#fff;border-radius:99px;font-size:10.5px;padding:0 6px;line-height:16px;font-weight:700}

main{min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:0 22px;position:sticky;top:0;z-index:15}

.topbar .gsearch{flex:1;max-width:420px;position:relative}
.topbar .gsearch input{width:100%;border:1px solid var(--line);background:#f6f7f9;border-radius:8px;padding:7px 12px 7px 32px;font-size:12.5px}
.topbar .gsearch svg{position:absolute;left:10px;top:8px;width:15px;height:15px;stroke:#98a2b3}
.topbar .sp{flex:1}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.05em;background:var(--ambbg);color:var(--amb);border:1px solid #f1d19a;border-radius:99px;padding:4px 11px;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.content{padding:20px 22px 60px}
h1{font-size:19px;margin:0;color:var(--navy);letter-spacing:-.01em}
.sub{color:var(--mute);margin:3px 0 16px;font-size:12.5px}
.row-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.row-head .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 12px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:1fr 1fr}.two{grid-template-columns:1.6fr 1fr}
.kpi b{font-size:24px;display:block;line-height:1.1;color:var(--navy);font-weight:750}
.kpi span{color:var(--mute);font-size:12px}
.kpi .d{font-size:11px;margin-top:4px}
.kpi.bad b{color:var(--red)}.kpi.warn b{color:var(--amb)}.kpi.ok b{color:var(--grn)}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.t-red{background:var(--redbg);color:#b42318}.t-amb{background:var(--ambbg);color:var(--amb)}.t-grn{background:var(--grnbg);color:var(--grn)}.t-blu{background:var(--accbg);color:var(--accink)}.t-gry{background:#eef0f3;color:#475467}.t-pur{background:#f0e9fa;color:#6941c6}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}

.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px;color:#34405a}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .c{opacity:.65;font-size:11px;margin-left:3px}
input,select,textarea{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:#fff;color:var(--ink)}
input[type=search],input[type=text]{min-width:200px}
textarea{width:100%;min-height:150px;line-height:1.55}
button.btn{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.btn.ghost{background:#fff;color:var(--navy);border-color:#cbd2e0}
button.btn.soft{background:var(--accbg);color:var(--accink);border-color:transparent}
button.btn.danger{background:#fff;color:#b42318;border-color:#f0c4c0}

.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f8f9fb;font-weight:700;position:sticky;top:0}

.bar{height:6px;background:#eceef2;border-radius:99px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--navy)}

.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:12px 0;font-size:12.5px}

.tl li:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--navy)}

.docview{background:#f8f9fb;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12.5px}
.mailprev{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12.5px;margin-top:10px}

.qitem:hover{border-color:#c9d0e0;box-shadow:0 2px 8px rgba(15,23,42,.06)}

.d-red{background:var(--red)}.d-amb{background:#e8890c}.d-blu{background:var(--navy)}.d-gry{background:#a7b0bf}.d-grn{background:#1f9d55}

.qitem .t{font-weight:600;color:var(--navy);font-size:13px}
.qitem .m{color:var(--mute);font-size:12px;margin-top:2px}
.src{font-size:10.5px;color:#98a2b3}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.chart .col .v{font-size:11px;font-weight:700;color:var(--navy)}
.chart .col .b{width:100%;max-width:38px;background:var(--accbg2,var(--accbg));border-radius:5px 5px 0 0;background:var(--navy);opacity:.85}
.chart .col .l{font-size:10.5px;color:var(--mute)}
.progress-steps{display:flex;gap:0;margin:14px 0}
.progress-steps .st{flex:1;text-align:center;font-size:11px;color:var(--mute);position:relative;padding-top:16px}
.progress-steps .st:before{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #d0d5dd}
.progress-steps .st:after{content:"";position:absolute;top:9px;left:calc(-50% + 8px);right:calc(50% + 8px);height:2px;background:#e4e7ec}
.progress-steps .st:first-child:after{display:none}
.progress-steps .st.done{color:var(--grn);font-weight:600}
.progress-steps .st.done:before{background:var(--grn);border-color:var(--grn)}
.progress-steps .st.done:after{background:var(--grn)}
.progress-steps .st.now{color:var(--acc);font-weight:700}
.progress-steps .st.now:before{border-color:var(--acc);background:var(--acc)}
.ofboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ofcard{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px}
.ofcard h4{margin:0 0 2px;font-size:13.5px;color:var(--navy)}
.matrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #eef0f4;font-size:12px}
.matrow:last-child{border:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;z-index:50;left:-240px;transition:left .2s}aside.open{left:0}.k4{grid-template-columns:repeat(2,1fr)}.two,.k2,.split{grid-template-columns:1fr}.content{padding:14px}}
</style></head>

const tag = (m,k)=> m[k]?`<span class="tag ${m[k][0]}">${m[k][1]}</span>`:'';

  </div>
  <div class="grid two">
    <div class="card"><h3>Decisiones pendientes</h3>${pend.length?pend.map(qitemHTML).join(''):'<div class="note">Sin decisiones pendientes.</div>'}</div>
    <div class="card"><h3>Piezas bajo mínimo</h3>${S.parts.filter(p=>p.stock<=p.min).map(p=>`
      <div class="matrow"><span class="dot ${p.stock===0?'d-red':'d-amb'}"></span><div style="flex:1"><b>${esc(p.desc)}</b><div class="mut small">${esc(p.maquina)}</div></div><span class="tag ${p.stock===0?'t-red':'t-amb'}">stock ${p.stock} / mín ${p.min}</span></div>`).join('')||'<div class="note">Stock al día.</div>'}

function qitemHTML(a){
  const dot = a.pri==='alta'?'d-red':a.pri==='media'?'d-amb':'d-gry';
  return `<div class="qitem" data-id="${a.id}"><span class="dot ${dot}"></span><div class="b"><div class="t">${esc(a.titulo)}</div><div class="m">${esc(a.detalle)}</div></div><span class="tag t-gry">${esc(a.tipo)}</span></div>`;
}

// ---------- Inbox ----------
CFG.views.inbox = c => {
  const pend = S.approvals.filter(a=>a.estado==='pendiente');
  const done = S.approvals.filter(a=>a.estado!=='pendiente');
  c.innerHTML = `<div class="row-head"><div><h1>Aprobaciones</h1><div class="sub">El sistema prepara y propone; la persona aprueba, edita o rechaza.</div></div></div>
  <h2 style="margin:6px 0 12px">Pendientes (${pend.length})</h2>
  ${pend.length?pend.map(qitemHTML).join(''):'<div class="note">Sin decisiones pendientes.</div>'}
  ${done.length?`<h2 style="margin:22px 0 12px">Resueltas (${done.length})</h2>`+done.map(a=>`<div class="qitem" data-id="${a.id}"><span class="dot d-grn"></span><div class="b"><div class="t">${esc(a.titulo)}</div><div class="m">${esc(a.estado)} · ${esc(a.resolucion||'')}</div></div></div>`).join(''):''}`;
  c.querySelectorAll('.qitem').forEach(q=>q.addEventListener('click',()=>openApproval(q.dataset.id)));
};

function openApproval(id){
  const a = S.approvals.find(x=>x.id===id); if(!a) return;
  const body = a.estado==='pendiente' ? `
    <div class="why"><b>Por qué importa:</b> ${esc(a.why)}</div>
    ${a.accion.kind==='mail'?`<h3>Correo propuesto (editable)</h3><textarea id="ap-mail">${a.accion.body}</textarea>`:''}
    ${a.accion.kind==='pedido'?`<div class="note">Acción propuesta: emitir pedido a <b>${esc(a.accion.prov)}</b> con:<br>· ${a.accion.piezas.join('<br>· ')}</div>`:''}
    <div class="act">
      ${a.accion.kind==='mail'?`<button class="btn" onclick="resolveApproval('${id}','mail')">Aprobar y enviar (simulado)</button>`:''}
      ${a.accion.kind==='pedido'?`<button class="btn" onclick="resolveApproval('${id}','pedido')">Aprobar y emitir pedido (simulado)</button>`:''}
      <button class="btn ghost" onclick="toast('Borrador guardado (simulado)')">Guardar borrador</button>
      <button class="btn danger" onclick="resolveApproval('${id}','rechazada')">Rechazar</button>
    </div>`
  : `<div class="note">Resuelta: ${esc(a.estado)} · ${esc(a.resolucion||'')}</div>`;
  openDrawer(`<div class="ph"><button class="x" onclick="closeDrawer()">×</button><h2>${esc(a.titulo)}</h2><div class="sub">${a.id} · ${esc(a.tipo)} · prioridad ${esc(a.pri)}</div></div><div class="pb"><p>${esc(a.detalle)}</p>${body}</div>`);
}
function resolveApproval(id, how){
  const a = S.approvals.find(x=>x.id===id); if(!a) return;
  if(how==='mail'){ a.estado='aprobada'; a.resolucion='correo registrado como enviado (simulado)'; logAct(`Aprobado: ${a.titulo}`); }
  else if(how==='pedido'){
    a.estado='aprobada'; a.resolucion='pedido emitido (simulado)';
    const n='PC-'+(4107+S.orders.filter(o=>o.id.startsWith('PC-41')).length);
    S.orders.unshift({id:n, prov:a.accion.prov, estado:'enviado', total:84.00, entrega:'previsto 48 h', lineas:[{desc:'Rodamiento 6314', qty:1, precio:84.00, estado:'pendiente'}]});
    const en=S.shipments.find(s=>s.id==='EN-220'); if(en){en.estado='en-transito'; en.fecha='salió hoy';}
    logAct(`Pedido ${n} emitido tras aprobación (simulado).`);
  }
  else { a.estado='rechazada'; a.resolucion='rechazada por el usuario'; logAct(`Rechazada: ${a.titulo}`); }
  save(); closeDrawer(); renderView(); toast(how==='rechazada'?'Decisión rechazada':'Aprobado y registrado (simulado)');
}

function openDoc(id){
  const d = S.docs.find(x=>x.id===id);
  const related = S.parts.filter(p=>(id==='DOC-LM18'&&['PZ-101','PZ-102','PZ-103','PZ-105','PZ-106','PZ-107','PZ-108'].includes(p.id))||(id==='DOC-TL60'&&['PZ-103','PZ-104'].includes(p.id))||(id==='DOC-SP14'&&['PZ-102','PZ-108'].includes(p.id)));
  drawerState = {tab:'piezas', render:()=>renderDocDrawer(id)};
  renderDocDrawer(id);
}
function renderDocDrawer(id){
  const d = S.docs.find(x=>x.id===id);
  const related = S.parts.filter(p=>(id==='DOC-LM18'&&['PZ-101','PZ-102','PZ-103','PZ-105','PZ-106','PZ-107','PZ-108'].includes(p.id))||(id==='DOC-TL60'&&['PZ-103','PZ-104'].includes(p.id))||(id==='DOC-SP14'&&['PZ-102','PZ-108'].includes(p.id)));
  const tabs = [{id:'piezas',l:'Piezas'},{id:'doc',l:'Documento'}];
  let body='';
  if(drawerState.tab==='piezas'){
    if(!related.length){ body='<div class="note">Documento sin despiece asociado (manual de uso).</div>'; }
    else body = tableHTML([
      {k:'s',l:'',f:p=>p.stock<=p.min?`<input type="checkbox" data-p="${p.id}" ${p.stock===0?'checked':''}>`:''},
      {k:'d',l:'Pieza',f:p=>`<b>${esc(p.desc)}</b><div class="mut small">${esc(p.maquina)}</div>`,wrap:true},
      {k:'st',l:'Stock',f:p=>`<span class="tag ${p.stock===0?'t-red':p.stock<=p.min?'t-amb':'t-grn'}">${p.stock}</span>`,num:true},
      {k:'p',l:'Precio',f:p=>fmtE(p.precio),num:true}
    ], related, {foot:'Marcadas: las que faltan o están en mínimo'});
    body += `<div class="act"><button class="btn" onclick="solicitarPiezas('${id}')">Crear solicitud de compra con las marcadas</button></div>`;
  } else {
    body = `<div class="docview">📄 ${esc(d.titulo)} (${esc(d.rev)})<br><br><span class="mut">En la demo no se muestra el plano real; en producción se abre el PDF con la vista explosionada y cada posición enlaza con su pieza.</span></div>`;
  }
  document.querySelector('#drawer .panel').innerHTML = `<div class="ph"><button class="x" onclick="closeDrawer()">×</button><h2>${esc(d.titulo)}</h2><div class="sub">${esc(d.tipo)} · ${esc(d.rev)}</div>${drawerTabs(tabs, drawerState.tab)}</div><div class="pb">${body}</div>`;
}
function solicitarPiezas(id){
  const sel=[...document.querySelectorAll('input[data-p]:checked')].map(i=>i.dataset.p);
  if(!sel.length){ toast('Marca al menos una pieza'); return; }
  const piezas = sel.map(pid=>S.parts.find(p=>p.id===pid));
  const n='SC-'+(300+S.approvals.length+1);
  S.approvals.unshift({id:n, pri:'media', tipo:'Solicitud de compra', estado:'pendiente',
    titulo:`Solicitud de compra desde plano (${sel.length} piezas)`,
    detalle:'Generada desde '+id+': '+piezas.map(p=>p.desc).join(', ')+'.',
    why:'Piezas sin stock o bajo mínimo detectadas desde el plano validado.',
    accion:{kind:'pedido', piezas:piezas.map(p=>`${p.desc} (1 ud) — ${fmtE(p.precio)}`), prov:piezas[0].prov}});
  logAct(`Solicitud de compra ${n} creada desde ${id} (${sel.length} piezas).`);
  save(); closeDrawer(); toast('Solicitud creada en Aprobaciones'); go('inbox');
}

function setFltPEstado(k){FLT_P.estado=k;renderView();}
function setFltPQ(v){FLT_P.q=v.toLowerCase();renderView();const i=document.querySelector('input[type=search]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
function reponer(pid){
  const p=S.parts.find(x=>x.id===pid);
  const n='SC-'+(300+S.approvals.length+1);
  S.approvals.unshift({id:n, pri:p.stock===0?'alta':'media', tipo:'Solicitud de compra', estado:'pendiente',
    titulo:`Reposición de ${p.desc}`,
    detalle:`Stock actual ${p.stock} (mínimo ${p.min}). Proveedor habitual: ${p.prov}, ${fmtE(p.precio)}/ud.`,
    why:'Mantener el stock de servicio evita máquinas de cliente paradas.',
    accion:{kind:'pedido', piezas:[`${p.desc} (${p.min*2} uds) — ${fmtE(p.precio*p.min*2)}`], prov:p.prov}});
  logAct(`Reposición propuesta para ${p.desc}.`); save(); toast('Propuesta en Aprobaciones'); go('inbox');
}

function openOrder(o){ drawerState = {tab:'lin', render:()=>renderOrderDrawer(o.id)}; renderOrderDrawer(o.id); }
function renderOrderDrawer(oid){
  const o = S.orders.find(x=>x.id===oid);
  const tabs = [{id:'lin',l:'Líneas'},{id:'seg',l:'Seguimiento'}];
  let body='';
  if(drawerState.tab==='lin'){
    body = tableHTML([
      {k:'d',l:'Descripción',f:l=>esc(l.desc),wrap:true},
      {k:'q',l:'Ud.',f:l=>l.qty,num:true},
      {k:'p',l:'Precio ud.',f:l=>fmtE(l.precio),num:true},
      {k:'e',l:'Estado',f:l=>tag(EST_L,l.estado)}
    ], o.lineas, {foot:`Total: ${fmtE(o.total)}`});
  } else {
    body = `<ul class="tl">
      <li><b>Pedido emitido</b><span class="w">compras</span></li>
      ${o.estado!=='borrador'?'<li><b>Enviado al proveedor</b></li>':''}
      ${['confirmado','recibido'].includes(o.estado)?'<li><b>Confirmado por el proveedor</b></li>':''}
      ${o.estado==='recibido'?'<li><b>Recepción registrada y verificada</b></li>':''}
      ${o.estado==='reclamado'?'<li><b>Reclamación abierta</b><span class="w">3/20 unidades defectuosas en banco</span></li>':''}
    </ul><div class="note">Historial de ejemplo.</div>`;
  }
  const acciones = [];
  if(!['recibido'].includes(o.estado)){
    acciones.push(`<button class="btn" onclick="mailSeguimiento('${o.id}')">Preparar seguimiento</button>`);
    if(o.lineas.some(l=>l.estado!=='recibido')) acciones.push(`<button class="btn soft" onclick="recepcionParcial('${o.id}')">Registrar recepción</button>`);
  }
  document.querySelector('#drawer .panel').innerHTML = `<div class="ph"><button class="x" onclick="closeDrawer()">×</button><h2>${o.id} · ${esc(o.prov)}</h2><div class="sub">Entrega: ${esc(o.entrega)} · ${tag(EST_O,o.estado)}</div>${drawerTabs(tabs, drawerState.tab)}</div><div class="pb">${body}<div class="act">${acciones.join('')}</div></div>`;
}
function mailSeguimiento(oid){
  const o = S.orders.find(x=>x.id===oid);
  openDrawer(`<div class="ph"><button class="x" onclick="closeDrawer()">×</button><h2>Seguimiento de ${o.id}</h2><div class="sub">El correo lo revisas antes de que salga (simulado)</div></div>
  <div class="pb"><textarea id="sg-mail">Buenos días,\n\nescribimos sobre el pedido ${o.id} (${o.lineas.map(l=>l.desc).join('; ')}). Estado actual: ${EST_O[o.estado][1].toLowerCase()}. Necesitamos confirmación de fecha o incidencias.\n\nGracias, un saludo.</textarea>
  <div class="act"><button class="btn" onclick="enviarSeguimiento('${o.id}')">Aprobar y enviar (simulado)</button><button class="btn ghost" onclick="openOrder(S.orders.find(x=>x.id==='${o.id}'))">Volver</button></div></div>`);
}
function enviarSeguimiento(oid){ logAct(`Seguimiento de ${oid} aprobado y registrado como enviado (simulado).`); save(); closeDrawer(); renderView(); toast('Correo registrado como enviado (simulado)'); }
function recepcionParcial(oid){
  const o = S.orders.find(x=>x.id===oid);
  const pend = o.lineas.filter(l=>l.estado!=='recibido');
  if(!pend.length) return;
  const l = pend[0]; l.estado='recibido';
  o.estado = o.lineas.every(x=>x.estado==='recibido') ? 'recibido' : 'parcial';
  const pz = S.parts.find(p=>p.desc===l.desc); if(pz){ pz.stock += l.qty; }
  logAct(`Recepción registrada en ${oid}: ${l.desc} (simulado).`);
  save(); renderOrderDrawer(oid); renderShell(); toast('Recepción registrada y stock actualizado (simulado)');
}
function nuevoPedido(){
  const n = 'PC-' + (4107 + S.orders.filter(o=>o.id.startsWith('PC-41')).length);
  S.orders.unshift({id:n, prov:'(sin asignar)', estado:'borrador', total:0, entrega:'—', lineas:[{desc:'Línea nueva (editar)', qty:1, precio:0, estado:'pendiente'}]});
  logAct(`Borrador ${n} creado (simulado).`); save(); renderView(); toast('Borrador creado'); openOrder(S.orders[0]);
}

// Automio OS · demo framework (datos de ejemplo, todo simulado en local)
const LSKEY = 'automio-demo-' + CFG.slug;
let S = loadState();
function loadState(){
  try{ const raw = localStorage.getItem(LSKEY); if(raw){ const p = JSON.parse(raw); if(p && p.v === CFG.v) return p.s; } }catch(e){}
  return JSON.parse(JSON.stringify(CFG.initial));
}
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify({v:CFG.v, s:S})); }catch(e){} }
function resetDemo(){ localStorage.removeItem(LSKEY); location.reload(); }

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN = (n,d=0) => Number(n).toLocaleString(CFG.locale,{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtE = n => fmtN(n,2) + ' €';
const $ = sel => document.querySelector(sel);
const el = html => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; };

let VIEW = location.hash ? location.hash.slice(1) : CFG.home;
let drawerState = null;

const ICONS = {
  panel:'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
  inbox:'M3 5h18v14H3zM3 7l9 6 9-6',
  compras:'M4 4h2l2.5 11h10L21 7H7M9 20a1 1 0 100-2 1 1 0 000 2M18 20a1 1 0 100-2 1 1 0 000 2',
  prov:'M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6',
  docs:'M7 3h7l5 5v13H7zM14 3v5h5',
  prod:'M4 20V10l5 3v-3l5 3V6h6v14z',
  cert:'M12 3l2.5 5 5.5.8-4 4 1 5.7-5-2.7-5 2.7 1-5.7-4-4L9.5 8z',
  act:'M12 8v5l3 2M12 21a9 9 0 110-18 9 9 0 010 18',
  conf:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1',
  proj:'M3 7h18M3 7v13h18V7M3 7l2-4h14l2 4M10 11h4',
  logi:'M1 8h13v9H1zM14 11h4l3 3v3h-7zM5.5 20a1.5 1.5 0 100-3 1.5 1.5 0 000 3M16.5 20a1.5 1.5 0 100-3 1.5 1.5 0 000 3',
  spare:'M14 7a4 4 0 105.6 5.6L14 7zm0 0L8 13m-3 8l6-6',
  search:'M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.35-4.35'
};
function icon(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[name]||ICONS.panel}"/></svg>`; }

function renderShell(){
  const mods = CFG.modules.map(m => {
    if(m.sec) return `<div class="sec">${esc(m.sec)}</div>`;
    const badge = m.badge ? `<span class="n">${typeof m.badge==='function'?m.badge(S):m.badge}</span>` : '';
    return `<a data-v="${m.id}" class="${VIEW===m.id?'on':''}" onclick="go('${m.id}')">${icon(m.icon)}<span>${esc(m.label)}</span>${badge}</a>`;
  }).join('');
  document.getElementById('app').innerHTML = `
  <aside id="side">
    <div class="brand"><div class="logo"><div class="mark">${esc(CFG.mark)}</div><div><div class="bn">${esc(CFG.company)}</div><div class="bs">AUTOMIO OS · DEMO</div></div></div></div>
    <nav>${mods}</nav>
    <div class="side-foot">${CFG.t.foot}</div>
  </aside>
  <main>
    <div class="topbar">
      <div class="crumb">${esc(CFG.company)} · ${esc((CFG.modules.find(m=>m.id===VIEW)||{}).label||'')}</div>
      <div class="sp"></div>
      <span class="pill">${CFG.t.pill}</span>
      <div class="avatar">${esc(CFG.userIni)}</div>
    </div>
    <div class="content" id="content"></div>
  </main>
  <div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()"></div>
  <div class="toast" id="toast"></div>`;
  renderView();
}
function go(v){ VIEW=v; location.hash=v; renderShell(); window.scrollTo(0,0); }
window.addEventListener('hashchange',()=>{ const v=location.hash.slice(1); if(v&&v!==VIEW){VIEW=v;renderShell();} });

function renderView(){
  const m = CFG.modules.find(x=>x.id===VIEW) || CFG.modules.find(x=>x.id===CFG.home);
  const c = document.getElementById('content'); if(!c) return;
  c.innerHTML = '';
  (CFG.views[m.id]||CFG.views[CFG.home])(c);
  document.querySelector('.topbar .crumb').innerHTML = `${esc(CFG.company)} · ${esc(m.label)}`;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on', a.dataset.v===m.id));
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2800); }

function openDrawer(html){ const d=$('#drawer'); d.innerHTML=`<div class="panel">${html}</div>`; d.classList.add('on'); }
function closeDrawer(){ $('#drawer').classList.remove('on'); drawerState=null; }

function logAct(text){ S.activity.unshift({ts:new Date().toISOString(), text}); if(S.activity.length>200)S.activity.length=200; save(); }

function chipRow(groups, active, onpick){
  // groups: [{key,label,count}]
  return `<div class="tools">${groups.map(g=>`<button class="chip ${active===g.key?'on':''}" onclick="${onpick}('${g.key}')">${esc(g.label)}${g.count!=null?` <span class="c">${g.count}</span>`:''}</button>`).join('')}</div>`;
}

function tableHTML(cols, rows, opts={}){
  const rowFn = opts.rowFn || (()=> '');
  const head = cols.map(c=>`<th style="${c.w?`width:${c.w}`:''}">${esc(c.l)}</th>`).join('');
  const body = rows.length ? rows.map((r,i)=>`<tr class="row" data-i="${i}" ${rowFn(r,i)}>${cols.map(c=>`<td class="${c.wrap?'wrap':''}" style="${c.num?'text-align:right':''}">${c.f(r)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="mut" style="text-align:center;padding:26px">${esc(opts.empty||CFG.t.empty)}</td></tr>`;
  const foot = opts.foot || `${rows.length} ${CFG.t.records}`;
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table><div class="tfoot">${foot}</div></div>`;
}

function attachRowClicks(root, rows, onclick){
  root.querySelectorAll('tr.row').forEach(tr=>tr.addEventListener('click',ev=>{
    if(ev.target.closest('button')||ev.target.closest('input')||ev.target.closest('select')||ev.target.closest('a')) return;
    onclick(rows[+tr.dataset.i]);
  }));
}

function steps(items, cur){
  return `<div class="progress-steps">${items.map((s,i)=>`<div class="st ${i<cur?'done':i===cur?'now':''}">${esc(s)}</div>`).join('')}</div>`;
}

function kv(pairs){ return `<div class="kv">${pairs.map(([k,v])=>`<div>${esc(k)}</div><div>${v}</div>`).join('')}</div>`; }

function mailPreview(m){
  return `<div class="mailprev"><div class="mh">${esc(CFG.t.mailto)}: ${esc(m.to)} · ${esc(CFG.t.mailsubj)}: ${esc(m.subj)}</div>${m.body}</div>`;
}

function drawerTabs(tabs, active){
  return `<div class="tabs">${tabs.map(t=>`<button class="${t.id===active?'on':''}" onclick="drawerState.tab='${t.id}';renderDrawerBody()">${esc(t.l)}</button>`).join('')}</div>`;
}
function renderDrawerBody(){ if(drawerState&&drawerState.render) drawerState.render(); }

document.addEventListener('DOMContentLoaded', renderShell);

</script></body></html>
